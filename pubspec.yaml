name: wallet8_flutter
description: The Wallet8 Flutter SDK - the reusable wallet core (credential store, device keys, OID4VCI/OID4VP drivers) other verticals' wallet apps embed.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web: ^1.0.0
  # The platform Flutter SDK - Bff8ApiClient is the ONLY backend path.
  sentin8:
    path: ../../sentin8/sentin8-flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
